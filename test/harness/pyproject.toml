[project]
name = "gnuworld-harness"
version = "0.1.0"
description = "Integration test harness for GNUWorld (fake P10 hub)"
requires-python = ">=3.10"
dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
timeout_func_only = true
testpaths = ["."]
pythonpath = ["."]
